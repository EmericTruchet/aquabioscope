[project]
name = "aquabioscope"
dynamic = ["version"]
description = "Retouche colorimétrique, renommage en masse et tag d'espèces pour photos de plongée sous-marine"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "Pillow>=10.3",
    "piexif>=1.1.3",
    "rawpy>=0.21",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
species-db = ["requests>=2.31"]

[project.scripts]
aquabioscope = "aquabioscope.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aquabioscope.__version__"}

[tool.setuptools.package-data]
aquabioscope = ["data/*.csv", "assets/*.ico", "assets/*.icns"]
