name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch_name: intel
          - os: macos-14
            arch_name: apple-silicon
    runs-on: ${{ matrix.os }}
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Compilation avec PyInstaller
        run: pyinstaller DivePhoto-macos.spec --noconfirm

      - name: Création de l'archive .zip de l'app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent DivePhoto.app DivePhoto-macos-${{ matrix.arch_name }}.zip

      - name: Publication de l'archive comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: DivePhoto-macos-${{ matrix.arch_name }}
          path: dist/DivePhoto-macos-${{ matrix.arch_name }}.zip

      - name: Ajout au Release GitHub (si déclenché par un tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DivePhoto-macos-${{ matrix.arch_name }}.zip
